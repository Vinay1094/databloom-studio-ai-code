name: Generate Databloom Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic (used if script is empty)'
        required: false
        default: 'Introduction to Generative AI'
      script:
        description: 'Full narration script (leave empty to auto-generate from topic)'
        required: false
        default: ''
      language:
        description: 'Narration language code (en, hi, es, fr, de)'
        required: false
        default: 'en'
      image_style:
        description: 'Image style: simple | gradient | photo | sketch'
        required: false
        default: 'simple'
      resolution:
        description: 'Resolution: 1280x720 | 1920x1080 | 1080x1080 | 1080x1920'
        required: false
        default: '1280x720'
      fps:
        description: 'Frames per second'
        required: false
        default: '30'
      project_name:
        description: 'Output project folder name'
        required: false
        default: 'databloom_demo'

jobs:
  generate-video:
    name: Generate Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure backend package is importable
        run: |
          touch backend/__init__.py
          touch backend/agents/__init__.py || true
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          python -c "import sys; sys.path.insert(0, '.'); from backend.video_agent import generate_video; print('Import OK')"

      - name: Generate video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PYEOF'
import sys, os, textwrap
sys.path.insert(0, os.getcwd())
os.environ.setdefault('PYTHONPATH', os.getcwd())

topic        = """${{ github.event.inputs.topic }}"""
raw_script   = """${{ github.event.inputs.script }}"""
language     = "${{ github.event.inputs.language }}"
image_style  = "${{ github.event.inputs.image_style }}"
resolution_s = "${{ github.event.inputs.resolution }}"
fps          = int("${{ github.event.inputs.fps }}" or "30")
project_name = "${{ github.event.inputs.project_name }}"

parts = resolution_s.split("x")
resolution = (int(parts[0]), int(parts[1])) if len(parts) == 2 else (1280, 720)

script = raw_script.strip()
if not script:
    script = textwrap.dedent(f"""
        Introduction: What is {topic}?

        Key concepts and ideas about {topic}.

        Practical applications of {topic}.

        Summary and closing thoughts about {topic}.
    """).strip()

print(f"Topic      : {topic}")
print(f"Language   : {language}")
print(f"Style      : {image_style}")
print(f"Resolution : {resolution}")
print(f"FPS        : {fps}")
print(f"Project    : {project_name}")
print(f"Script len : {len(script)} chars")

from backend.video_agent import generate_video

os.makedirs("outputs", exist_ok=True)

result = generate_video(
    script=script,
    output_dir="outputs",
    project_name=project_name,
    language=language,
    image_style=image_style,
    frame_rate=fps,
    resolution=resolution,
)

video_path = result.get("video_path") or result.get("output_path", "")
print(f"Video generated: {video_path}")

with open("video_output_path.txt", "w") as f:
    f.write(video_path)
PYEOF

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: outputs/
          retention-days: 7
          if-no-files-found: warn

